[experiment]
name = "v094-frozen-signal-diagnostic-30x4"
run_dir = "../runs/v094-signal-diagnostic"
working_dir = ".."
timeout_seconds = 7200

[command]
argv = [
  ".venv/bin/python", "-m", "mini_agent_rl.cli", "collect-rl",
  "--model-path", "/models/qwen_08b",
  "--adapter-path", "checkpoints/qwen35-08b-thinking-sft-v090/checkpoint-200",
  "--data", "data/hotpot-agent-v041/train.jsonl",
  "--task-limit", "30", "--corpus-limit", "100",
  "--retriever-version", "bm25-v2", "--observation-encoding", "compact-v3",
  "--group-size", "4", "--temperature", "0.7", "--seed", "42",
  "--max-steps", "3", "--max-input-tokens", "2048", "--max-new-tokens", "128",
  "--generation-timeout", "600", "--timeout-minutes", "120",
  "--db", "runs/v094-signal-diagnostic.db",
  "--output", "runs/v094-signal-diagnostic.jsonl",
  "--report", "reports/v094-signal-diagnostic.json"
]

[inputs]
data = "../data/hotpot-agent-v041/train.jsonl"
model = "/models/qwen_08b"
adapter = "../checkpoints/qwen35-08b-thinking-sft-v090/checkpoint-200"

