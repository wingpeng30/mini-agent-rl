[experiment]
name = "v083-local-8gb-smoke"
run_dir = "../runs/v083-local-8gb-smoke"
working_dir = ".."
timeout_seconds = 1800

[command]
# 首次运行保持 4-bit、768 token 和相同数据；不要在迁移前同时改多个变量。
argv = ["mini-agent-rl", "train-grpo", "--load-in-4bit", "--max-input-tokens", "768", "--task-limit", "5", "--group-size", "4", "--output-dir", "checkpoints/qwen35-08b-grpo-v083-smoke"]

[inputs]
data = "../data/hotpot-agent-v041/train.jsonl"
model = "D:/qwen_08b"
adapter = "../checkpoints/qwen35-08b-sft-v052"
