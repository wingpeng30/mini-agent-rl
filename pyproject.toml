[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent-rl"
version = "0.1.0"
description = "一个离线、RL-ready 的最小工具调用 Agent 框架"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "typer>=0.12", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mini-agent-rl = "mini_agent_rl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
