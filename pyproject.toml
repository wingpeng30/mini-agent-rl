[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent-rl"
version = "0.7.3"
description = "一个离线、RL-ready 的最小工具调用 Agent 框架"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "typer>=0.12", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]
local-model = ["transformers @ git+https://github.com/huggingface/transformers.git@5474a55e920f358d8382f3ecd3377edca979baa1", "torch>=2.4", "accelerate>=1.0", "pillow>=10"]
quant = ["bitsandbytes>=0.44"]
train = ["transformers @ git+https://github.com/huggingface/transformers.git@5474a55e920f358d8382f3ecd3377edca979baa1", "torch>=2.4", "accelerate>=1.0", "datasets>=3.0", "peft>=0.13", "trl>=0.12"]
data = ["datasets>=3.0"]

[project.scripts]
mini-agent-rl = "mini_agent_rl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
